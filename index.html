<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrillData — Boletim de Sondagem Mineral</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; max-width: 650px; margin: 0 auto; }
    h2 { color: #38bdf8; margin-bottom: 2px; }
    .subtitle { color: #94a3b8; font-size: 0.85rem; margin-bottom: 16px; }
    form { display: flex; flex-direction: column; gap: 12px; background: #1e293b; padding: 18px; border-radius: 12px; border: 1px solid #334155; }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    label { font-size: 0.8rem; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 4px; }
    input, select, textarea { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 0.9rem; box-sizing: border-box; }
    button { background: #0284c7; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
    .btn-gps { background: #334155; padding: 8px; font-size: 0.8rem; border-radius: 6px; border: 1px solid #475569; color: #38bdf8; margin-top: 4px; cursor: pointer; width: 100%; font-weight: bold; }
    .btn-gps:active { background: #475569; }
    .calc-box { background: #0f172a; border: 1px solid #0284c7; padding: 10px; border-radius: 6px; text-align: center; color: #38bdf8; font-weight: bold; font-size: 0.9rem; }
    .export-box { background: #1e293b; padding: 16px; border-radius: 12px; border: 1px solid #334155; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
    .btn-excel { background: #15803d; }
    .btn-pdf { background: #b91c1c; }
    .card { background: #1e293b; border-left: 4px solid #38bdf8; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #334155; font-size: 0.85rem; }
    
    /* Layout do PDF */
    #pdfTemplate { display: none; background: #fff; color: #000; padding: 15px; font-family: Arial, sans-serif; }
    #pdfTemplate table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 9px; }
    #pdfTemplate th { background: #0f172a; color: #fff; padding: 5px; border: 1px solid #cbd5e1; }
    #pdfTemplate td { padding: 4px; border: 1px solid #cbd5e1; text-align: center; }
  </style>
</head>
<body>

  <h2>⛏️ DrillData — Campo</h2>
  <div class="subtitle">Sistema de Coleta e Emissão de Boletins Diários de Sondagem</div>

  <form id="drillForm">
    <!-- Cabeçalho do Furo -->
    <div class="row">
      <div>
        <label>Projeto / Cliente</label>
        <input type="text" id="projeto" value="Mineração Santa Rita" required>
      </div>
      <div>
        <label>Furo</label>
        <input type="text" id="furo" placeholder="DDH-024" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Sonda / Equipamento</label>
        <input type="text" id="maquina" placeholder="CS14" required>
      </div>
      <div>
        <label>Sondador Responsável</label>
        <input type="text" id="sondador" value="Natanael Souza" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Data</label>
        <input type="date" id="dataOperacao" required>
      </div>
      <div>
        <label>Horário (Início - Fim)</label>
        <div style="display:flex; gap:4px;">
          <input type="time" id="horaIni" required>
          <input type="time" id="horaFim" required>
        </div>
      </div>
    </div>

    <!-- Dados da Manobra -->
    <div class="row">
      <div>
        <label>Prof. Inicial (m)</label>
        <input type="number" step="0.01" id="profInicial" oninput="calcularAvanco()" required>
      </div>
      <div>
        <label>Prof. Final (m)</label>
        <input type="number" step="0.01" id="profFinal" oninput="calcularAvanco()" required>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Testemunho Rec. (m)</label>
        <input type="number" step="0.01" id="recMetros" oninput="calcularAvanco()" required>
      </div>
      <div>
        <label>Nº Caixa Atual</label>
        <input type="number" id="numCaixa" placeholder="Ex: 1" required>
      </div>
    </div>

    <!-- Indicadores Automáticos -->
    <div class="calc-box" id="displayCalc">
      Avanço: 0.00 m | Recuperação: 0.0%
    </div>

    <div class="row">
      <div>
        <label>Horas Parado (h)</label>
        <input type="number" step="0.5" id="horasParado" value="0">
      </div>
      <div>
        <label>Motivo da Parada</label>
        <select id="motivoParada">
          <option value="Nenhuma">Nenhuma</option>
          <option value="Troca de Broca">Troca de Broca</option>
          <option value="Manutenção Mecânica">Manutenção Mecânica</option>
          <option value="Aguardando Água">Aguardando Água</option>
          <option value="Chuva / Clima">Chuva / Clima</option>
        </select>
      </div>
    </div>

    <div class="row">
      <div>
        <label>Diesel Consumido (L)</label>
        <input type="number" id="diesel" value="0">
      </div>
      <div>
        <label>Coordenadas (GPS)</label>
        <input type="text" id="coords" placeholder="Obtendo posição..." readonly>
        <button type="button" class="btn-gps" onclick="capturarGPS()">📍 Atualizar GPS</button>
      </div>
    </div>

    <div>
      <label>Observação Litológica / Operacional</label>
      <textarea id="obs" rows="2" placeholder="Descreva a rocha, fraturamento ou alteração..."></textarea>
    </div>

    <button type="submit">💾 Salvar Manobra no Dispositivo</button>
  </form>

  <div class="export-box">
    <label style="font-weight:bold;">📄 Gerar Documentos Oficiais</label>
    <button type="button" class="btn-excel" onclick="gerarExcel()">📊 Exportar Planilha Iluminada (.xlsx)</button>
    <button type="button" class="btn-pdf" onclick="gerarPDF()">📄 Exportar Relatório PDF (.pdf)</button>
  </div>

  <h3 style="margin-top: 20px; color: #94a3b8;">Manobras Registradas</h3>
  <div id="recordsList"></div>

  <!-- Template para PDF -->
  <div id="pdfTemplate">
    <h2 style="color:#0f172a; text-align:center; margin-bottom:5px;">DRILLDATA — BOLETIM DIÁRIO DE SONDAGEM</h2>
    <div id="pdfHeaderInfo" style="margin-bottom:10px; font-size:10px; background:#f1f5f9; padding:8px; border-radius:4px;"></div>
    <table>
      <thead>
        <tr>
          <th>Item</th>
          <th>Data/Hora</th>
          <th>De (m)</th>
          <th>Até (m)</th>
          <th>Avanço</th>
          <th>Acumul.</th>
          <th>Recup.</th>
          <th>Nº Cx</th>
          <th>Parada</th>
          <th>Observação Litológica</th>
        </tr>
      </thead>
      <tbody id="pdfTableBody"></tbody>
    </table>
  </div>

  <script>
    document.getElementById('dataOperacao').valueAsDate = new Date();

    function capturarGPS() {
      const inputCoords = document.getElementById('coords');
      if ('geolocation' in navigator) {
        inputCoords.placeholder = "Obtendo GPS...";
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            inputCoords.value = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`;
          },
          (err) => {
            inputCoords.placeholder = "GPS Indisponível";
          },
          { enableHighAccuracy: true, timeout: 10000 }
        );
      } else {
        inputCoords.placeholder = "Não suportado";
      }
    }
    // Tenta obter o GPS automaticamente ao carregar a página
    capturarGPS();

    function calcularAvanco() {
      const pIni = parseFloat(document.getElementById('profInicial').value) || 0;
      const pFin = parseFloat(document.getElementById('profFinal').value) || 0;
      const recM = parseFloat(document.getElementById('recMetros').value) || 0;
      
      const avanco = pFin - pIni;
      const recPerc = avanco > 0 ? (recM / avanco) * 100 : 0;

      document.getElementById('displayCalc').innerHTML = 
        `Avanço Manobra: <b>${avanco.toFixed(2)} m</b> | Recuperação: <b>${recPerc.toFixed(1)}%</b>`;
    }

    let db;
    const request = indexedDB.open('DrillDataDB', 3);
    request.onupgradeneeded = (e) => {
      db = e.target.result;
      if (!db.objectStoreNames.contains('boletins')) {
        db.createObjectStore('boletins', { keyPath: 'id', autoIncrement: true });
      }
    };
    request.onsuccess = (e) => { db = e.target.result; renderRecords(); };

    document.getElementById('drillForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const pIni = parseFloat(document.getElementById('profInicial').value) || 0;
      const pFin = parseFloat(document.getElementById('profFinal').value) || 0;
      const recM = parseFloat(document.getElementById('recMetros').value) || 0;
      const avanco = pFin - pIni;

      const record = {
        projeto: document.getElementById('projeto').value,
        furo: document.getElementById('furo').value,
        maquina: document.getElementById('maquina').value,
        sondador: document.getElementById('sondador').value,
        data: document.getElementById('dataOperacao').value,
        horaIni: document.getElementById('horaIni').value,
        horaFim: document.getElementById('horaFim').value,
        profInicial: pIni,
        profFinal: pFin,
        avanco: avanco,
        recMetros: recM,
        recPerc: avanco > 0 ? (recM / avanco) * 100 : 0,
        numCaixa: parseInt(document.getElementById('numCaixa').value) || 1,
        horasParado: parseFloat(document.getElementById('horasParado').value) || 0,
        motivoParada: document.getElementById('motivoParada').value,
        diesel: parseFloat(document.getElementById('diesel').value) || 0,
        coords: document.getElementById('coords').value,
        obs: document.getElementById('obs').value
      };

      const tx = db.transaction('boletins', 'readwrite');
      tx.objectStore('boletins').add(record);
      tx.oncomplete = () => {
        document.getElementById('profInicial').value = pFin;
        document.getElementById('profFinal').value = '';
        document.getElementById('recMetros').value = '';
        document.getElementById('obs').value = '';
        calcularAvanco();
        renderRecords();
      };
    });

    function renderRecords() {
      const list = document.getElementById('recordsList');
      list.innerHTML = '';
      let acm = 0;
      const tx = db.transaction('boletins', 'readonly');
      tx.objectStore('boletins').openCursor().onsuccess = (e) => {
        const cursor = e.target.result;
        if (cursor) {
          const item = cursor.value;
          acm += item.avanco;
          list.innerHTML += `
            <div class="card">
              <strong>${item.furo}</strong> — Manobra: ${item.profInicial}m a ${item.profFinal}m (+${item.avanco.toFixed(2)}m)<br>
              <small><b>Acumulado: ${acm.toFixed(2)}m</b> | Caixa: Nº ${item.numCaixa} | Recup: ${item.recPerc.toFixed(1)}%</small><br>
              ${item.coords ? `<small style="color:#38bdf8">📍 GPS: ${item.coords}</small><br>` : ''}
              <small style="color:#cbd5e1">${item.data} (${item.horaIni} - ${item.horaFim}) | ${item.obs}</small>
            </div>
          `;
          cursor.continue();
        }
      };
    }

    async function obterDados() {
      return new Promise((res) => {
        const list = [];
        const tx = db.transaction('boletins', 'readonly');
        tx.objectStore('boletins').openCursor().onsuccess = (e) => {
          const cursor = e.target.result;
          if (cursor) { list.push(cursor.value); cursor.continue(); } else { res(list); }
        };
      });
    }

    async function gerarExcel() {
      const dados = await obterDados();
      if (!dados.length) return alert('Sem dados registrados.');
      let acumulado = 0;
      const formatted = dados.map((r, i) => {
        acumulado += r.avanco;
        return {
          "Item": i + 1,
          "Data": r.data,
          "Horário": `${r.horaIni} - ${r.horaFim}`,
          "Furo": r.furo,
          "Prof. Inicial (m)": r.profInicial,
          "Prof. Final (m)": r.profFinal,
          "Avanço (m)": r.avanco,
          "Acumulado (m)": acumulado,
          "Recuperado (m)": r.recMetros,
          "Recuperação (%)": r.recPerc / 100,
          "Nº Caixa": r.numCaixa,
          "Horas Paradas (h)": r.horasParado,
          "Motivo Parada": r.motivoParada,
          "Diesel (L)": r.diesel,
          "GPS Coordenadas": r.coords,
          "Observação Litológica": r.obs
        };
      });

      const ws = XLSX.utils.json_to_sheet(formatted);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Boletim Sondagem");
      XLSX.writeFile(wb, `boletim_sondagem_${dados[0].furo}.xlsx`);
    }

    async function gerarPDF() {
      const dados = await obterDados();
      if (!dados.length) return alert('Sem dados registrados.');
      
      let acumulado = 0;
      const body = document.getElementById('pdfTableBody');
      body.innerHTML = '';
      
      const header = dados[0];
      document.getElementById('pdfHeaderInfo').innerHTML = `
        <b>Projeto:</b> ${header.projeto} | <b>Furo:</b> ${header.furo} | <b>Sonda:</b> ${header.maquina} | <b>Sondador:</b> ${header.sondador} | <b>Data:</b> ${header.data} <br>
        <b>GPS:</b> ${header.coords ? header.coords : 'Não informado'}
      `;

      dados.forEach((r, i) => {
        acumulado += r.avanco;
        body.innerHTML += `
          <tr>
            <td>${i + 1}</td>
            <td>${r.data}<br>${r.horaIni}-${r.horaFim}</td>
            <td>${r.profInicial.toFixed(2)}</td>
            <td>${r.profFinal.toFixed(2)}</td>
            <td>+${r.avanco.toFixed(2)}</td>
            <td><b>${acumulado.toFixed(2)}</b></td>
            <td>${r.recMetros.toFixed(2)}</td>
            <td>${r.numCaixa}</td>
            <td>${r.horasParado}h</td>
            <td style="text-align:left;">${r.obs}</td>
          </tr>
        `;
      });

      const el = document.getElementById('pdfTemplate');
      el.style.display = 'block';
      html2pdf().set({
        margin: 8,
        filename: `Boletim_${header.furo}.pdf`,
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
      }).from(el).save().then(() => el.style.display = 'none');
    }
  </script>
</body>
</html>
